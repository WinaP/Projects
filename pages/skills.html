<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Portfolio — Skills Log</title>
  <link rel="stylesheet" href="../css/style.css">
</head>

<body data-page="skills" class="dark">

<header id="site-header">
  <div class="container inner">

    <a href="../index.html" class="brand">
      ✦ Project Portfolio ✦
    </a>

    <button class="menu-toggle" id="menu-toggle">
      ☰
    </button>

    <nav class="mobile-menu" id="nav-menu">
      <a href="../index.html">Overview</a>
      <a href="projects.html">Projects</a>
      <a href="skills.html" class="active">Skills</a>
    </nav>

  </div>
</header>

<main class="container page-wrap">
  <div class="page-header">
    <p class="eyebrow">By Wina Prasetyo · 31/07/2026</p>
    <h1>Skill Log</h1>
    <p>A breakdown of my skills!</p>
  </div>

  <div class="skill-chart-sticky">

    <div class="card">
      <h4 style="font-size:0.72rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-faint);margin-bottom:1rem">
        Skill Proficiency
      </h4>
      <canvas id="proficiency-chart" width="900" height="400"></canvas>
      <div style="margin-top:0.8rem;display:flex;flex-direction:column;gap:0.35rem;font-size:0.72rem;color:var(--text-faint)">
        <span style="display:flex;align-items:center;gap:0.4rem"><span style="width:8px;height:8px;background:#F56565;border-radius:2px;display:inline-block"></span>≥ 90 — Advanced</span>
        <span style="display:flex;align-items:center;gap:0.4rem"><span style="width:8px;height:8px;background:#ED64A6;border-radius:2px;display:inline-block"></span>≥ 70 — Proficient</span>
        <span style="display:flex;align-items:center;gap:0.4rem"><span style="width:8px;height:8px;background:#FFFFFF;border-radius:2px;display:inline-block"></span>≥ 45 — Intermediate</span>
        <span style="display:flex;align-items:center;gap:0.4rem"><span style="width:8px;height:8px;background:#718096;border-radius:2px;display:inline-block"></span>&lt; 45 — Learning</span>
      </div>
    </div>
  </div>
  
  <div class="skill-timeline" id="skill-timeline"></div>
</main>

<footer>
  <div class="container inner">
    <span>Wina Prasetyo · wina.p8168@gmail.com</span>
    <span>31/07/2026</span>
  </div>
</footer>

<script>
const menuToggle = document.getElementById("menu-toggle");
const navMenu = document.getElementById("nav-menu");

menuToggle.addEventListener("click", function() {
  navMenu.style.display =
    navMenu.style.display === "flex" ? "none" : "flex";
});

const body = document.body;
const button = document.getElementById("theme-toggle");

const savedTheme = localStorage.getItem("theme") || "dark";

body.classList.remove("light", "dark");
body.classList.add(savedTheme);

button.textContent = savedTheme === "dark" ? "☀️" : "🌙";

button.addEventListener("click", () => {
    const newTheme = body.classList.contains("dark")
        ? "light"
        : "dark";

    body.classList.remove("light", "dark");
    body.classList.add(newTheme);

    localStorage.setItem("theme", newTheme);

    button.textContent = newTheme === "dark" ? "☀️" : "🌙";
});
</script>
  
<script src="../js/skills.js"></script>
</body>
</html>
